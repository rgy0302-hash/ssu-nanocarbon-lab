# GitHub Pages 자동 배포
# main 브랜치에 변경 사항이 올라오면(사진 추가, 데이터 수정 포함) 자동으로 사이트를 다시 만들어 배포합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 저장소 주소에 맞춰 사이트 주소와 하위 경로를 자동으로 넣습니다.
          #   사용자명.github.io 저장소 → BASE_PATH = ''  (루트)
          #   그 외 저장소             → BASE_PATH = '/저장소명'
          # 직접 구입한 도메인을 연결하면 configure-pages 가 그 주소를 알려 줍니다.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
